name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests pandas >/dev/null 2>&1
      - run: |
          python -u tools/probe.py > probe.log 2>&1 || true
          mkdir -p logs; cp probe.log logs/probe.log
          git config user.name gha; git config user.email a@b.c
          git add logs; git commit -qm probe; git pull --rebase -q; git push
