name: kospi-treemap
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 후)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install yfinance requests squarify matplotlib pandas
      - name: Collect
        run: python -u collect.py 2>&1 | tee collect.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Render
        run: python -u render.py data/kospi_mcap.csv kospi.mp4 --top 60 2>&1 | tee render.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Render absolute
        run: python -u render.py data/kospi_mcap.csv kospi_abs.mp4 --top 60 --abs
      - name: Save render log
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          mkdir -p logs; tail -c 5000 render.log > logs/render.log || true
          git add logs; git diff --cached --quiet || git commit -qm 'render log'; git pull --rebase -q || true; git push || true
      - name: Commit data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p logs; tail -c 6000 collect.log > logs/collect.log
          git add data logs; git diff --cached --quiet || git commit -m "data: update $(date +%F)"; git pull --rebase -q || true; git push || true
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest -t "KOSPI treemap (latest)" -n "자동 갱신"
          gh release upload latest kospi.mp4 kospi_abs.mp4 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kospi-mp4
          path: |
            kospi.mp4
            kospi_abs.mp4
