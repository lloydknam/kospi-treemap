name: kospi-treemap
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 후)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          (which ffmpeg && fc-list | grep -qi 'noto.*cjk') || timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk || true
          pip install yfinance requests squarify matplotlib pandas
      - name: Collect
        run: python -u collect.py 2>&1 | tee collect.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Render both
        run: |
          set +e
          python -u render.py data/kospi_mcap.csv kospi.mp4 > render.log 2>&1 &
          P1=$!
          python -u render.py data/kospi_mcap.csv kospi_abs.mp4 --abs > render_abs.log 2>&1 &
          P2=$!
          wait $P1; echo "P1 exit $?" > step.log
          wait $P2; echo "P2 exit $?" >> step.log
          ls -la kospi*.mp4 >> step.log 2>&1
          tail -3 render.log render_abs.log >> step.log 2>&1
          cat step.log
          exit 0
        shell: bash
      - name: Save logs
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          mkdir -p logs; tail -c 5000 collect.log > logs/collect.log || true; cat step.log render.log render_abs.log 2>/dev/null | tail -c 4000 > logs/render.log || true
          git add logs; git diff --cached --quiet || git commit -qm "logs"; git pull --rebase -q || true; git push || true
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest -t "KOSPI treemap (latest)" -n "자동 갱신"
          gh release upload latest kospi.mp4 kospi_abs.mp4 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kospi-mp4
          path: |
            kospi.mp4
            kospi_abs.mp4
