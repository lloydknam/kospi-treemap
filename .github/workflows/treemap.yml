name: kospi-treemap
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 후)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install pykrx squarify matplotlib pandas
      - name: Collect
        run: python collect.py
      - name: Render
        run: python render.py data/kospi_mcap.csv kospi.mp4 --top 60
      - name: Commit data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data; git diff --cached --quiet || git commit -m "data: update $(date +%F)"; git push
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest -t "KOSPI treemap (latest)" -n "자동 갱신"
          gh release upload latest kospi.mp4 --clobber
      - uses: actions/upload-artifact@v4
        with: { name: kospi-mp4, path: kospi.mp4 }
